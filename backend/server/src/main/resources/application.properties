spring.application.name=server
server.port=8081

# ----------------------------------------------
# DATABASE (MYSQL) CONFIGURATION
# ----------------------------------------------

# Replace 'chat_app_db' if your database has a different name
spring.datasource.url=jdbc:mysql://localhost:3306/chat_app_db?useSSL=false&serverTimezone=UTC

# !!! IMPORTANT !!!
# Change these to your actual MySQL username and password
spring.datasource.username=root
spring.datasource.password=root

# ----------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------------

# This is a development helper. 'update' means Spring will try to
# automatically update your database tables to match your Java code.
spring.jpa.hibernate.ddl-auto=update

# This makes the generated SQL queries show up in your terminal (good for debugging)
spring.jpa.show-sql=true